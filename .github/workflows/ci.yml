name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - run: bun install --frozen-lockfile
      - name: Generated files are up to date
        run: bun run generate && git diff --exit-code -- packages/agno-api/src/generated
      # agno-hooks resolves @rodrigocoliveira/agno-api through its exports map (dist/),
      # so the packages must be built before anything typechecks or tests them.
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - run: bun run --filter demo-react typecheck && bun run --filter demo-react build
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: demo-agentos wires up without an LLM key
        run: |
          cd examples/demo-agentos
          uv sync
          uv run --python 3.12 python -c "import server; assert len(server.agent_os.agents) == 6"
          uv run --python 3.12 python tokens.py | python3 -c "import json,sys; d=json.load(sys.stdin); assert set(d)=={'admin','user-1','user-2'}"

  e2e:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Start the zero-key AgentOS server
        env:
          AGNO_PORT: 7778
        run: |
          cd e2e/agentos
          uv run --python 3.12 python server.py &
      - name: Wait for the server to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf localhost:7778/health; then exit 0; fi
            sleep 1
          done
          echo "server did not become healthy in time" >&2
          exit 1
      - run: AGNO_URL=http://localhost:7778 bun run test:e2e
      - name: Stop the AgentOS server
        if: always()
        run: pkill -f 'python server.py' || true
